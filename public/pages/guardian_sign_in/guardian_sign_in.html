<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guardian Sign In</title>

    <script defer src="/__/firebase/12.15.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script type="module" src="/init_fb.js"></script>

    <style>
      body {
        background: #eef3f8;
        color: #1f2933;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      main {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 520px;
        padding: 40px 20px;
      }

      section {
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        padding: 28px;
      }

      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }

      p {
        color: #52606d;
        line-height: 1.5;
        margin: 0 0 20px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 700;
        margin: 16px 0 6px;
      }

      input {
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        box-sizing: border-box;
        font: inherit;
        padding: 11px 12px;
        width: 100%;
      }

      button {
        background: #0369a1;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        margin-top: 20px;
        padding: 12px 16px;
        width: 100%;
      }

      button.secondary {
        background: #ffffff;
        border: 1px solid #cbd5e1;
        color: #1f2933;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .divider {
        align-items: center;
        color: #697586;
        display: flex;
        gap: 12px;
        margin: 22px 0 4px;
      }

      .divider::before,
      .divider::after {
        background: #d9e2ec;
        content: "";
        flex: 1;
        height: 1px;
      }

      .secondary-link {
        color: #697586;
        font-size: 13px;
        margin-top: 16px;
        text-align: center;
      }

      .secondary-link a {
        color: #0369a1;
        font-weight: 700;
      }

      #guardian-sign-in-status {
        background: #e0f2fe;
        border-radius: 6px;
        color: #075985;
        margin-top: 16px;
        min-height: 20px;
        padding: 12px;
      }

      #guardian-sign-in-status.is-error {
        background: #fee2e2;
        color: #991b1b;
      }

      @media (max-width: 560px) {
        main {
          padding: 0;
        }

        section {
          border-radius: 0;
          box-shadow: none;
          min-height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="guardian-sign-in-title">
        <h1 id="guardian-sign-in-title">Guardian Sign In</h1>
        <p>Sign in with your guardian email and password, or continue with Google.</p>

        <form id="guardian-email-sign-in-form">
          <label for="guardian-email">Email</label>
          <input id="guardian-email" name="email" type="email" autocomplete="email" required>

          <label for="guardian-password">Password</label>
          <input id="guardian-password" name="password" type="password" autocomplete="current-password" required>

          <button id="guardian-email-sign-in-submit" type="submit">Sign In With Email</button>
        </form>

        <div class="divider">or</div>

        <button id="guardian-google-sign-in" class="secondary" type="button">Sign In With Google</button>

        <div class="secondary-link">
          New guardian? <a href="/pages/guardian_sign_up/guardian_sign_up.html">Create an account</a>
        </div>

        <div id="guardian-sign-in-status" role="status">Ready.</div>
      </section>
    </main>

    <script type="module" src="/pages/guardian_sign_in/guardian_sign_in.js?v=20260710-google-auth-fix"></script>
  </body>
</html>
