<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guardian Landing Page</title>

    <script defer src="/__/firebase/12.15.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script type="module" src="/init_fb.js"></script>

    <style>
      body {
        background: #eef3f8;
        color: #1f2933;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      main {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 720px;
        padding: 40px 20px;
      }

      section {
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        padding: 28px;
      }

      h1 {
        font-size: 26px;
        margin: 0 0 8px;
      }

      p {
        color: #52606d;
        margin: 0 0 20px;
      }

      dl {
        display: grid;
        gap: 12px;
        grid-template-columns: 180px 1fr;
        margin: 0;
      }

      dt {
        color: #52606d;
        font-weight: 700;
      }

      dd {
        margin: 0;
      }

      button {
        background: #0369a1;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        margin-top: 24px;
        padding: 10px 16px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #guardian-landing-status {
        background: #e0f2fe;
        border-radius: 6px;
        color: #075985;
        margin-top: 20px;
        padding: 12px;
      }

      #guardian-landing-status.is-error {
        background: #fee2e2;
        color: #991b1b;
      }

      @media (max-width: 600px) {
        main {
          padding: 0;
        }

        section {
          border-radius: 0;
          box-shadow: none;
          min-height: 100vh;
        }

        dl {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="guardian-landing-title">
        <h1 id="guardian-landing-title">Guardian Dashboard</h1>
        <p id="guardian-landing-subtitle">Loading your guardian profile...</p>

        <dl id="guardian-profile" hidden>
          <dt>Name</dt>
          <dd id="guardian-profile-name"></dd>
          <dt>Email</dt>
          <dd id="guardian-profile-email"></dd>
          <dt>Authentication</dt>
          <dd id="guardian-profile-auth-type"></dd>
          <dt>Registration date</dt>
          <dd id="guardian-profile-registration-date"></dd>
        </dl>

        <button id="guardian-log-out" type="button" hidden>Log Out</button>
        <div id="guardian-landing-status" role="status">Checking sign in status...</div>
      </section>
    </main>

    <script type="module" src="/pages/guardian_landing_page/guardian_landing_page.js?v=20260710-google-auth-fix"></script>
  </body>
</html>
