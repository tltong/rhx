<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generate Questions</title>

    <script defer src="/__/firebase/12.15.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script type="module" src="/init_fb.js"></script>

    <style>
      body {
        background: #eef3f8;
        box-sizing: border-box;
        color: #0f172a;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        min-height: 100vh;
        padding: 32px;
      }

      main {
        margin: 0 auto;
        max-width: 980px;
      }

      section {
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        padding: 28px;
      }

      h1 {
        font-size: 28px;
        margin: 0 0 8px;
      }

      h2 {
        font-size: 20px;
        margin: 28px 0 12px;
      }

      p {
        color: #475569;
        margin: 0 0 24px;
      }

      label {
        color: #334155;
        display: block;
        font-size: 14px;
        font-weight: 700;
        margin: 0 0 6px;
      }

      select,
      textarea,
      input,
      pre {
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        box-sizing: border-box;
        font: inherit;
        width: 100%;
      }

      select,
      input {
        padding: 10px 12px;
      }

      textarea {
        min-height: 110px;
        padding: 12px;
        resize: vertical;
      }

      button {
        background: #0369a1;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        margin-top: 18px;
        padding: 12px 18px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      pre {
        background: #f8fafc;
        min-height: 220px;
        overflow: auto;
        padding: 14px;
        white-space: pre-wrap;
      }

      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .settings-grid {
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr 1fr;
      }

      .wide {
        grid-column: 1 / -1;
      }

      .topics-list {
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        display: grid;
        gap: 10px;
        min-height: 72px;
        padding: 14px;
      }

      .topic-option {
        align-items: start;
        display: flex;
        gap: 10px;
      }

      .topic-option input {
        margin-top: 3px;
        width: auto;
      }

      .topic-name {
        font-weight: 700;
      }

      .topic-subtopics {
        color: #64748b;
        font-size: 13px;
        margin-top: 3px;
      }

      .empty-state {
        color: #64748b;
        padding: 12px;
        text-align: center;
      }

      .status {
        background: #e0f2fe;
        border-radius: 6px;
        color: #075985;
        margin: 18px 0;
        min-height: 20px;
        padding: 12px;
      }

      .status.error {
        background: #fee2e2;
        color: #991b1b;
      }

      .prompt-pane {
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        margin: 24px 0 0;
        padding: 16px;
      }

      .prompt-meta {
        color: #334155;
        font-weight: 700;
        margin: 0 0 12px;
      }

      .prompt-pane h2 {
        margin-top: 0;
      }

      @media (max-width: 820px) {
        body {
          padding: 0;
        }

        section {
          border-radius: 0;
          box-shadow: none;
          min-height: 100vh;
        }

        .grid,
        .settings-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="generate-questions-title">
        <h1 id="generate-questions-title">Generate Questions</h1>
        <p>Select an existing syllabus and topic, then generate and store questions.</p>

        <div class="grid">
          <div>
            <label for="country">Country</label>
            <select id="country"></select>
          </div>

          <div>
            <label for="level">Level</label>
            <select id="level"></select>
          </div>

          <div>
            <label for="year">Year</label>
            <select id="year"></select>
          </div>

          <div>
            <label for="subject">Subject</label>
            <select id="subject"></select>
          </div>
        </div>

        <h2>Topics</h2>
        <div id="topics-list" class="topics-list"></div>

        <h2>Generation Settings</h2>
        <div class="settings-grid">
          <div>
            <label for="number-of-questions">Number of questions per selected topic</label>
            <input id="number-of-questions" type="number" min="1" max="50" step="1" value="3">
          </div>

          <div>
            <label for="difficulty">Difficulty</label>
            <select id="difficulty">
              <option value="Easy">Easy</option>
              <option value="Medium">Medium</option>
              <option value="Hard">Hard</option>
            </select>
          </div>

          <div>
            <label for="language">Language</label>
            <select id="language">
              <option value="English">English</option>
              <option value="Chinese">Chinese</option>
              <option value="Malay">Malay</option>
              <option value="Tamil">Tamil</option>
            </select>
          </div>

          <div>
            <label for="temperature">Temperature</label>
            <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.2">
          </div>

          <div class="wide">
            <label for="special-instruction">Special instructions</label>
            <textarea id="special-instruction" placeholder="Optional instruction for the generated questions"></textarea>
          </div>
        </div>

        <div class="prompt-pane" aria-labelledby="prompt-preview-title">
          <h2 id="prompt-preview-title">LLM Prompt</h2>
          <div class="prompt-meta">Temperature: <span id="temperature-preview">0.2</span></div>
          <label for="prompt-preview">Prompt</label>
          <pre id="prompt-preview">Select a syllabus and topic to preview the prompt.</pre>
        </div>

        <button id="generate-button" type="button">Generate And Save</button>

        <div id="status" class="status" role="status">Loading syllabuses...</div>

        <label for="output">Output</label>
        <pre id="output">{}</pre>
      </section>
    </main>

    <script type="module" src="./generate_questions.js?v=20260712-deepseek-empty-retry"></script>
  </body>
</html>
