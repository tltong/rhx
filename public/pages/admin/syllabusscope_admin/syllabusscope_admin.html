<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Syllabus Scope Admin</title>

    <script defer src="/__/firebase/12.15.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script type="module" src="/init_fb.js"></script>

    <style>
      body {
        background: #eef3f8;
        color: #1f2933;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      main {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 920px;
        padding: 36px 20px;
      }

      section {
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        padding: 28px;
      }

      h1 {
        font-size: 26px;
        margin: 0 0 8px;
      }

      h2 {
        font-size: 20px;
        margin: 0;
      }

      h3 {
        font-size: 17px;
        margin: 0;
        text-transform: capitalize;
      }

      p {
        color: #52606d;
        line-height: 1.5;
        margin: 0 0 20px;
      }

      label {
        color: #334155;
        display: block;
        font-size: 14px;
        font-weight: 700;
        margin: 0 0 6px;
      }

      input {
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        box-sizing: border-box;
        font: inherit;
        padding: 10px 12px;
        width: 100%;
      }

      button {
        background: #0369a1;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 10px 14px;
      }

      button.secondary {
        background: #ffffff;
        border: 1px solid #cbd5e1;
        color: #1f2933;
      }

      button.danger {
        background: #fee2e2;
        color: #991b1b;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .topbar,
      .country-row,
      .level-header {
        align-items: end;
        display: grid;
        gap: 12px;
      }

      .topbar {
        grid-template-columns: 1fr auto auto;
        margin-bottom: 20px;
      }

      .country-row {
        grid-template-columns: 1fr auto;
      }

      #countries-list {
        display: grid;
        gap: 16px;
      }

      .country-card {
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        padding: 16px;
      }

      .level-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .levels-list {
        display: grid;
        gap: 12px;
        margin-top: 14px;
      }

      .level-card {
        background: #f8fafc;
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        padding: 14px;
      }

      .level-header {
        grid-template-columns: 1fr auto;
      }

      .grade-options {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }

      .grade-option {
        align-items: center;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        display: flex;
        gap: 8px;
        margin: 0;
        padding: 8px 10px;
      }

      input[type="checkbox"] {
        width: auto;
      }

      .empty-state {
        background: #f8fafc;
        border: 1px dashed #cbd5e1;
        border-radius: 8px;
        color: #52606d;
        padding: 18px;
        text-align: center;
      }

      #syllabusscope-status {
        background: #e0f2fe;
        border-radius: 6px;
        color: #075985;
        margin-top: 18px;
        min-height: 20px;
        padding: 12px;
      }

      #syllabusscope-status.is-error {
        background: #fee2e2;
        color: #991b1b;
      }

      @media (max-width: 760px) {
        main {
          padding: 0;
        }

        section {
          border-radius: 0;
          box-shadow: none;
          min-height: 100vh;
        }

        .topbar,
        .country-row,
        .level-header {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="syllabusscope-admin-title">
        <h1 id="syllabusscope-admin-title">Syllabus Scope Admin</h1>
        <p>Manage countries, levels, and grades.</p>

        <div class="topbar">
          <h2>Countries</h2>
          <button id="add-country" class="secondary" type="button">Add Country</button>
          <button id="save-scopes" type="button">Save All</button>
        </div>

        <div id="countries-list"></div>

        <div id="syllabusscope-status" role="status">Loading...</div>
      </section>
    </main>

    <template id="country-template">
      <article class="country-card">
        <div class="country-row">
          <div>
            <label>Country</label>
            <input class="country-name" type="text" placeholder="Country name" autocomplete="country-name">
          </div>
          <button class="danger remove-country" type="button">Remove Country</button>
        </div>

        <div class="level-toolbar"></div>
        <div class="levels-list"></div>
      </article>
    </template>

    <template id="level-template">
      <section class="level-card">
        <div class="level-header">
          <h3></h3>
          <button class="danger remove-level" type="button">Remove Level</button>
        </div>

        <div class="grade-options"></div>
      </section>
    </template>

    <template id="grade-checkbox-template">
      <label class="grade-option">
        <input class="grade-checkbox" type="checkbox">
        <span></span>
      </label>
    </template>

    <script type="module" src="/pages/admin/syllabusscope_admin/syllabusscope_admin.js?v=20260711-skip-empty-levels"></script>
  </body>
</html>
