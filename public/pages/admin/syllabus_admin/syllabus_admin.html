<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Syllabus Admin</title>

    <script defer src="/__/firebase/12.15.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script type="module" src="/init_fb.js"></script>

    <style>
      body {
        background: #eef3f8;
        color: #1f2933;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      main {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 900px;
        padding: 36px 20px;
      }

      section {
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        padding: 28px;
      }

      h1 {
        font-size: 26px;
        margin: 0 0 8px;
      }

      p {
        color: #52606d;
        line-height: 1.5;
        margin: 0 0 20px;
      }

      label {
        color: #334155;
        display: block;
        font-size: 14px;
        font-weight: 700;
        margin: 0 0 6px;
      }

      input,
      select {
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        box-sizing: border-box;
        font: inherit;
        padding: 10px 12px;
        width: 100%;
      }

      button {
        background: #0369a1;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 10px 14px;
      }

      button.secondary {
        background: #ffffff;
        border: 1px solid #cbd5e1;
        color: #1f2933;
      }

      button.danger {
        background: #fee2e2;
        color: #991b1b;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .toolbar {
        align-items: end;
        display: grid;
        gap: 14px;
        grid-template-columns: 1fr 1fr auto auto;
        margin-bottom: 22px;
      }

      .topics-header {
        align-items: center;
        border-top: 1px solid #d9e2ec;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        padding-top: 20px;
      }

      .topics-header h2 {
        font-size: 20px;
        margin: 0;
      }

      #topics-list {
        display: grid;
        gap: 14px;
        margin-top: 14px;
      }

      .topic-card {
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        padding: 16px;
      }

      .topic-row,
      .subtopic-row {
        align-items: end;
        display: grid;
        gap: 10px;
      }

      .topic-row {
        grid-template-columns: 1fr auto;
      }

      .subtopics-list {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }

      .subtopic-row {
        grid-template-columns: 1fr auto;
      }

      .topic-actions {
        margin-top: 14px;
      }

      .empty-state {
        background: #f8fafc;
        border: 1px dashed #cbd5e1;
        border-radius: 8px;
        color: #52606d;
        padding: 18px;
        text-align: center;
      }

      #syllabus-status {
        background: #e0f2fe;
        border-radius: 6px;
        color: #075985;
        margin-top: 18px;
        min-height: 20px;
        padding: 12px;
      }

      #syllabus-status.is-error {
        background: #fee2e2;
        color: #991b1b;
      }

      @media (max-width: 760px) {
        main {
          padding: 0;
        }

        section {
          border-radius: 0;
          box-shadow: none;
          min-height: 100vh;
        }

        .toolbar,
        .topic-row,
        .subtopic-row {
          grid-template-columns: 1fr;
        }

        .topics-header {
          align-items: stretch;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="syllabus-admin-title">
        <h1 id="syllabus-admin-title">Syllabus Admin</h1>
        <p>Create and edit syllabus topics and subtopics for each standard and subject.</p>

        <div class="toolbar">
          <div>
            <label for="syllabus-standard">Standard</label>
            <select id="syllabus-standard"></select>
          </div>

          <div>
            <label for="syllabus-subject">Subject</label>
            <select id="syllabus-subject"></select>
          </div>

          <button id="load-syllabus" class="secondary" type="button">Load</button>
          <button id="save-syllabus" type="button">Save</button>
        </div>

        <div class="topics-header">
          <h2>Topics</h2>
          <button id="add-topic" class="secondary" type="button">Add Topic</button>
        </div>

        <div id="topics-list"></div>

        <div id="syllabus-status" role="status">Ready.</div>
      </section>
    </main>

    <template id="topic-template">
      <article class="topic-card">
        <div class="topic-row">
          <div>
            <label>Topic</label>
            <input class="topic-name" type="text" placeholder="Topic name">
          </div>
          <button class="danger remove-topic" type="button">Remove Topic</button>
        </div>

        <div class="subtopics-list"></div>

        <div class="topic-actions">
          <button class="secondary add-subtopic" type="button">Add Subtopic</button>
        </div>
      </article>
    </template>

    <template id="subtopic-template">
      <div class="subtopic-row">
        <div>
          <label>Subtopic</label>
          <input class="subtopic-name" type="text" placeholder="Subtopic name">
        </div>
        <button class="danger remove-subtopic" type="button">Remove</button>
      </div>
    </template>

    <script type="module" src="/pages/admin/syllabus_admin/syllabus_admin.js?v=20260710-subtopic-sequence"></script>
  </body>
</html>
