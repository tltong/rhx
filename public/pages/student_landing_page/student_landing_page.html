<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Landing Page</title>

    <script defer src="/__/firebase/12.15.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script type="module" src="/init_fb.js"></script>

    <style>
      body {
        background: #eef3f8;
        color: #1f2933;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      main {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 720px;
        padding: 40px 20px;
      }

      section {
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        padding: 28px;
      }

      h1 {
        font-size: 26px;
        margin: 0 0 8px;
      }

      h2 {
        font-size: 20px;
        margin: 28px 0 12px;
      }

      p {
        color: #52606d;
        margin: 0 0 20px;
      }

      dl {
        display: grid;
        gap: 12px;
        grid-template-columns: 180px 1fr;
        margin: 0;
      }

      dt {
        color: #52606d;
        font-weight: 700;
      }

      dd {
        margin: 0;
      }

      .practice-list {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }

      .practice-card {
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        padding: 14px;
      }

      .practice-card-title {
        color: #102a43;
        font-weight: 700;
        margin: 0 0 6px;
      }

      .practice-card-meta {
        color: #52606d;
        font-size: 14px;
        margin: 0;
      }

      .practice-card-action {
        background: #0369a1;
        border-radius: 6px;
        color: #ffffff;
        display: inline-block;
        font-size: 14px;
        font-weight: 700;
        margin-top: 12px;
        padding: 8px 12px;
        text-decoration: none;
      }

      .empty-state {
        color: #64748b;
        margin: 0;
      }

      button {
        background: #0369a1;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        margin-top: 24px;
        padding: 10px 16px;
      }

      #student-landing-status {
        background: #e0f2fe;
        border-radius: 6px;
        color: #075985;
        margin-top: 20px;
        padding: 12px;
      }

      #student-landing-status.is-error {
        background: #fee2e2;
        color: #991b1b;
      }

      @media (max-width: 600px) {
        main {
          padding: 0;
        }

        section {
          border-radius: 0;
          box-shadow: none;
          min-height: 100vh;
        }

        dl {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="student-landing-title">
        <h1 id="student-landing-title">Student Dashboard</h1>
        <p id="student-landing-subtitle">Loading your student profile...</p>

        <dl id="student-profile" hidden>
          <dt>Name</dt>
          <dd id="student-profile-name"></dd>
          <dt>Username</dt>
          <dd id="student-profile-username"></dd>
          <dt>Year of birth</dt>
          <dd id="student-profile-year-of-birth"></dd>
          <dt>Registered in</dt>
          <dd id="student-profile-year-of-registration"></dd>
          <dt>Registration date</dt>
          <dd id="student-profile-registration-date"></dd>
          <dt>Standard</dt>
          <dd id="student-profile-standard"></dd>
        </dl>

        <div id="student-practices" hidden>
          <h2>Assigned Practices</h2>
          <div id="student-practice-list" class="practice-list"></div>
        </div>

        <button id="student-log-out" type="button" hidden>Log Out</button>
        <div id="student-landing-status" role="status">Checking sign in status...</div>
      </section>
    </main>

    <script type="module" src="/pages/student_landing_page/student_landing_page.js?v=20260711-practice-current-user"></script>
  </body>
</html>
