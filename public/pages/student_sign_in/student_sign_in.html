<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Sign In</title>

    <script defer src="/__/firebase/12.15.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script type="module" src="/init_fb.js"></script>

    <style>
      body {
        background: #eef3f8;
        color: #1f2933;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      main {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 480px;
        padding: 40px 20px;
      }

      section {
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        padding: 28px;
      }

      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }

      p {
        color: #52606d;
        line-height: 1.5;
        margin: 0 0 20px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 700;
        margin: 16px 0 6px;
      }

      input {
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        box-sizing: border-box;
        font: inherit;
        padding: 11px 12px;
        width: 100%;
      }

      .hint,
      .secondary-link {
        color: #697586;
        font-size: 13px;
        margin-top: 6px;
      }

      .secondary-link {
        margin-top: 16px;
        text-align: center;
      }

      .secondary-link a {
        color: #0369a1;
        font-weight: 700;
      }

      button {
        background: #0369a1;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        margin-top: 22px;
        padding: 12px 16px;
        width: 100%;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #student-sign-in-status {
        background: #e0f2fe;
        border-radius: 6px;
        color: #075985;
        margin-top: 16px;
        min-height: 20px;
        padding: 12px;
      }

      #student-sign-in-status.is-error {
        background: #fee2e2;
        color: #991b1b;
      }

      @media (max-width: 520px) {
        main {
          padding: 0;
        }

        section {
          border-radius: 0;
          box-shadow: none;
          min-height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="student-sign-in-title">
        <h1 id="student-sign-in-title">Student Sign In</h1>
        <p>Use your student username and 6 digit PIN.</p>

        <form id="student-sign-in-form">
          <label for="student-username">Username</label>
          <input id="student-username" name="username" type="text" autocomplete="username" required>
          <div id="student-email-preview" class="hint">Your login email is username@rhx.com.</div>

          <label for="student-pin">6 digit PIN</label>
          <input id="student-pin" name="pin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="current-password" required>

          <button id="student-sign-in-submit" type="submit">Sign In</button>
        </form>

        <div class="secondary-link">
          New student? <a href="/pages/student_sign_up/student_sign_up.html">Create an account</a>
        </div>

        <div id="student-sign-in-status" role="status">Ready.</div>
      </section>
    </main>

    <script type="module" src="/pages/student_sign_in/student_sign_in.js"></script>
  </body>
</html>
