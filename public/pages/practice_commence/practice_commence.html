<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Practice</title>

    <script defer src="/__/firebase/12.15.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script type="module" src="/init_fb.js"></script>

    <style>
      body {
        background: #eef3f8;
        color: #1f2933;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      main {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 860px;
        padding: 40px 20px;
      }

      section {
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        padding: 28px;
      }

      h1 {
        font-size: 28px;
        margin: 0 0 8px;
      }

      p {
        color: #52606d;
        margin: 0 0 20px;
      }

      button,
      .button-link {
        background: #0369a1;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        display: inline-block;
        font: inherit;
        font-weight: 700;
        margin-top: 20px;
        padding: 10px 16px;
        text-decoration: none;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      .practice-meta {
        color: #52606d;
        font-size: 14px;
        margin-bottom: 24px;
      }

      .question-list {
        display: grid;
        gap: 16px;
      }

      .question-card {
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        padding: 16px;
      }

      .question-title {
        color: #102a43;
        font-weight: 700;
        margin: 0 0 12px;
      }

      .option-label {
        align-items: start;
        display: flex;
        gap: 10px;
        margin: 8px 0;
      }

      .option-label input {
        margin-top: 2px;
      }

      .status {
        background: #e0f2fe;
        border-radius: 6px;
        color: #075985;
        margin-top: 20px;
        padding: 12px;
      }

      .status.is-error {
        background: #fee2e2;
        color: #991b1b;
      }

      .result {
        border: 1px solid #d9e2ec;
        border-radius: 8px;
        margin-top: 20px;
        padding: 16px;
      }

      @media (max-width: 600px) {
        main {
          padding: 0;
        }

        section {
          border-radius: 0;
          box-shadow: none;
          min-height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="practice-title">
        <h1 id="practice-title">Practice</h1>
        <p id="practice-subtitle">Loading practice...</p>
        <div id="practice-meta" class="practice-meta"></div>

        <form id="practice-form" hidden>
          <div id="question-list" class="question-list"></div>
          <button id="submit-practice" type="submit" disabled>Submit Practice</button>
        </form>

        <div id="practice-result" class="result" hidden></div>
        <div id="practice-status" class="status" role="status">Checking sign in status...</div>
      </section>
    </main>

    <script type="module" src="./practice_commence.js?v=20260711-nested-questions"></script>
  </body>
</html>
