<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Sign Up</title>

    <script defer src="/__/firebase/12.15.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script type="module" src="/init_fb.js"></script>

    <style>
      body {
        background: #eef3f8;
        color: #1f2933;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      main {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 520px;
        padding: 40px 20px;
      }

      section {
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        padding: 28px;
      }

      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }

      p {
        color: #52606d;
        line-height: 1.5;
        margin: 0 0 20px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 700;
        margin: 16px 0 6px;
      }

      input,
      select {
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        box-sizing: border-box;
        font: inherit;
        padding: 11px 12px;
        width: 100%;
      }

      .hint {
        color: #697586;
        font-size: 13px;
        margin-top: 6px;
      }

      button {
        background: #0369a1;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        margin-top: 22px;
        padding: 12px 16px;
        width: 100%;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #student-sign-up-status {
        background: #e0f2fe;
        border-radius: 6px;
        color: #075985;
        margin-top: 16px;
        min-height: 20px;
        padding: 12px;
      }

      #student-sign-up-status.is-error {
        background: #fee2e2;
        color: #991b1b;
      }

      @media (max-width: 560px) {
        main {
          padding: 0;
        }

        section {
          border-radius: 0;
          box-shadow: none;
          min-height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="student-sign-up-title">
        <h1 id="student-sign-up-title">Student Sign Up</h1>
        <p>Create your student account using your name, username, 6 digit PIN, year of birth, and current standard.</p>

        <form id="student-sign-up-form">
          <label for="student-name">Student name</label>
          <input id="student-name" name="name" type="text" autocomplete="name" required>

          <label for="student-username">Username</label>
          <input id="student-username" name="username" type="text" autocomplete="username" required>
          <div id="student-email-preview" class="hint"></div>

          <label for="student-pin">6 digit PIN</label>
          <input id="student-pin" name="pin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="new-password" required>

          <label for="student-year-of-birth">Year of birth</label>
          <input id="student-year-of-birth" name="yearOfBirth" type="number" min="1900" max="2026" required>

          <label for="student-standard">Standard</label>
          <select id="student-standard" name="standard" required>
            <option value="">Choose standard</option>
            <option value="1">Standard 1</option>
            <option value="2">Standard 2</option>
            <option value="3">Standard 3</option>
            <option value="4">Standard 4</option>
            <option value="5">Standard 5</option>
            <option value="6">Standard 6</option>
          </select>

          <button id="student-sign-up-submit" type="submit" disabled>Create Student Account</button>
        </form>

        <div id="student-sign-up-status" role="status">Ready.</div>
      </section>
    </main>

    <script type="module" src="/pages/student_sign_up/student_sign_up.js?v=20260709-username-message-fix"></script>
  </body>
</html>
