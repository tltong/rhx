<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ReadyHeroX</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background: #eef3f8;
        color: #102a43;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        min-height: 100vh;
      }

      main {
        margin: 0 auto;
        max-width: 920px;
        padding: 56px 24px;
      }

      .page-heading {
        margin-bottom: 28px;
        text-align: center;
      }

      h1 {
        font-size: 34px;
        margin: 0 0 8px;
      }

      .page-heading p {
        color: #52606d;
        margin: 0;
      }

      .account-sections {
        display: grid;
        gap: 18px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .account-section {
        background: #ffffff;
        border: 1px solid #cbd9e6;
        border-radius: 8px;
        padding: 26px;
      }

      h2 {
        font-size: 24px;
        margin: 0 0 8px;
      }

      .account-section p {
        color: #52606d;
        margin: 0 0 22px;
      }

      nav {
        display: grid;
        gap: 10px;
      }

      nav a {
        border: 1px solid #0369a1;
        border-radius: 6px;
        color: #0369a1;
        display: block;
        font-weight: 700;
        padding: 12px 16px;
        text-align: center;
        text-decoration: none;
      }

      nav a:first-child {
        background: #0369a1;
        color: #ffffff;
      }

      nav a:hover,
      nav a:focus-visible {
        box-shadow: 0 0 0 3px rgba(3, 105, 161, 0.14);
        outline: 0;
      }

      @media (max-width: 680px) {
        main {
          padding: 34px 16px;
        }

        .account-sections {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="page-heading">
        <h1>ReadyHeroX</h1>
        <p>Choose how you want to continue.</p>
      </header>

      <div class="account-sections">
        <section class="account-section">
          <h2>Student</h2>
          <p>Access your learning account.</p>
          <nav aria-label="Student account">
            <a href="/features/student/pages/sign_up/sign_up.html">Student Sign Up</a>
            <a href="/features/student/pages/sign_in/sign_in.html">Student Sign In</a>
          </nav>
        </section>

        <section class="account-section">
          <h2>Guardian</h2>
          <p>Access your guardian account.</p>
          <nav aria-label="Guardian account">
            <a href="/features/guardian/pages/sign_up/sign_up.html">Guardian Sign Up</a>
            <a href="/features/guardian/pages/sign_in/sign_in.html">Guardian Sign In</a>
          </nav>
        </section>
      </div>
    </main>
  </body>
</html>
