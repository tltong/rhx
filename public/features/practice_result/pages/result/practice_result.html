<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Practice Results</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.css" integrity="sha384-1vdNCNel6Tx/NQa8IR1mGOGKsbGreCkOPfbtPPnUURJ5Tu2PRVfQ/7KLZC+Pi1p1" crossorigin="anonymous">
    <link rel="stylesheet" href="./practice_result.css?v=20260824-practice-review">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js" integrity="sha384-ycJ6GAwiS15LoUPipwJOrWTvkUHl/YqELValBwI5I4awP1EeEQJYarj+w85ntcz7" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/contrib/auto-render.min.js" integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous"></script>

    <script defer src="/__/firebase/12.15.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script type="module" src="/init_fb.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Practice Results</h1>
        <p id="practice-result-subtitle">Loading your completed practice...</p>
      </header>

      <div
        id="practice-result-status"
        class="status"
        role="status"
        aria-live="polite"
      >
        Loading result...
      </div>

      <section
        id="practice-result-summary"
        class="result-summary"
        aria-label="Result summary"
        hidden
      >
        <div class="summary-item">
          <span class="summary-label">Score</span>
          <span id="result-score" class="summary-value"></span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Correct answers</span>
          <span id="result-correct" class="summary-value"></span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Completed</span>
          <span id="result-date" class="summary-value"></span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Time taken</span>
          <span id="result-time" class="summary-value"></span>
        </div>
      </section>

      <ol id="practice-result-questions" class="question-list" hidden></ol>
    </main>

    <script type="module" src="./practice_result.js?v=20260824-practice-review"></script>
  </body>
</html>
