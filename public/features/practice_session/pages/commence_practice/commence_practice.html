<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Commence Practice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.css" integrity="sha384-1vdNCNel6Tx/NQa8IR1mGOGKsbGreCkOPfbtPPnUURJ5Tu2PRVfQ/7KLZC+Pi1p1" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js" integrity="sha384-ycJ6GAwiS15LoUPipwJOrWTvkUHl/YqELValBwI5I4awP1EeEQJYarj+w85ntcz7" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/contrib/auto-render.min.js" integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous"></script>

    <script defer src="/__/firebase/12.15.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script type="module" src="/init_fb.js"></script>

    <style>
      body {
        background: #eef3f8;
        color: #102a43;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      main {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 960px;
        padding: 40px 20px;
      }


      h1 {
        font-size: 30px;
        margin: 0 0 8px;
      }

      .practice-summary {
        color: #52606d;
        margin: 0;
      }

      .status {
        background: #e0f2fe;
        border-radius: 6px;
        color: #075985;
        margin-top: 24px;
        padding: 12px;
      }

      .status.is-error {
        background: #fee2e2;
        color: #991b1b;
      }

      .question-list {
        display: grid;
        gap: 16px;
        list-style: none;
        margin: 24px 0 0;
        padding: 0;
      }

      .question-item {
        background: #ffffff;
        border: 1px solid #cbd9e6;
        border-radius: 8px;
        padding: 20px;
      }

      .question-item h2 {
        font-size: 18px;
        margin: 0 0 12px;
      }

      .question-text {
        font-size: 17px;
        line-height: 1.5;
        margin: 0;
      }

      .question-diagram {
        border: 1px solid #d5e1ec;
        border-radius: 6px;
        margin: 16px 0;
        overflow: auto;
        padding: 12px;
        text-align: center;
      }

      .question-diagram img {
        display: block;
        height: auto;
        margin: 0 auto;
        max-height: 520px;
        max-width: 100%;
        width: auto;
      }

      .question-options {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        list-style: none;
        margin: 16px 0 0;
        padding: 0;
      }

      .question-options li {
        background: #f5f8fb;
        border: 1px solid #d5e1ec;
        border-radius: 6px;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .question-options label {
        align-items: flex-start;
        cursor: pointer;
        display: flex;
        gap: 8px;
        padding: 10px 12px;
      }

      .question-options input {
        flex: 0 0 auto;
        margin: 3px 0 0;
      }

      .question-options label:focus-within {
        outline: 3px solid #7dd3fc;
        outline-offset: 1px;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 20px;
      }

      button {
        background: #0369a1;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 12px 18px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      button:focus-visible {
        outline: 3px solid #7dd3fc;
        outline-offset: 2px;
      }

      .result {
        background: #ffffff;
        border: 1px solid #cbd9e6;
        border-radius: 8px;
        margin-top: 24px;
        padding: 20px;
      }

      .result h2 {
        font-size: 22px;
        margin: 0 0 16px;
      }

      .result-details {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin: 0;
      }

      .result-details dt {
        color: #52606d;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .result-details dd {
        font-size: 20px;
        font-weight: 700;
        margin: 0;
      }

      @media (max-width: 640px) {
        .question-options,
        .result-details {
          grid-template-columns: 1fr;
        }

        .actions button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Commence Practice</h1>
        <p id="practice-summary" class="practice-summary">
          Loading practice...
        </p>
      </header>

      <div id="commence-practice-status" class="status" role="status">
        Loading questions...
      </div>
      <ol id="commence-practice-questions" class="question-list" hidden></ol>

      <div id="commence-practice-actions" class="actions" hidden>
        <button id="submit-practice" type="button" disabled>
          Submit Practice
        </button>
      </div>

      <section id="practice-result" class="result" hidden>
        <h2>Practice Result</h2>
        <dl class="result-details">
          <div>
            <dt>Score</dt>
            <dd id="result-score"></dd>
          </div>
          <div>
            <dt>Correct answers</dt>
            <dd id="result-correct"></dd>
          </div>
          <div>
            <dt>Time taken</dt>
            <dd id="result-time"></dd>
          </div>
        </dl>
      </section>
    </main>

    <script
      type="module"
      src="./commence_practice.js?v=20260826-student-landing-redirect-v1"
    ></script>
  </body>
</html>
