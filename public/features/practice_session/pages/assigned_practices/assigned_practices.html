<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assigned Practices</title>

    <script defer src="/__/firebase/12.15.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script type="module" src="/init_fb.js"></script>

    <style>
      body {
        background: #eef3f8;
        color: #102a43;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      main {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 960px;
        padding: 40px 20px;
      }

      header {
        margin-bottom: 24px;
      }

      .back-link {
        color: #0369a1;
        display: inline-block;
        font-weight: 700;
        margin-bottom: 16px;
        text-decoration: none;
      }

      h1 {
        font-size: 30px;
        margin: 0 0 8px;
      }

      header p {
        color: #52606d;
        margin: 0;
      }

      .status {
        background: #e0f2fe;
        border-radius: 6px;
        color: #075985;
        padding: 12px;
      }

      .status.is-error {
        background: #fee2e2;
        color: #991b1b;
      }

      .practice-list {
        display: grid;
        gap: 12px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .practice-item {
        background: #ffffff;
        border: 1px solid #cbd9e6;
        border-radius: 8px;
        overflow: hidden;
      }

      .practice-link,
      .unavailable-practice {
        color: inherit;
        display: block;
        padding: 18px;
        text-decoration: none;
      }

      .practice-link:hover {
        background: #f5f8fb;
      }

      .practice-link:focus-visible {
        outline: 3px solid #7dd3fc;
        outline-offset: -3px;
      }

      .practice-item.is-unavailable {
        opacity: 0.72;
      }

      .practice-item h2 {
        font-size: 19px;
        margin: 0 0 12px;
      }

      .practice-details {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin: 0;
      }

      .practice-details div {
        min-width: 0;
      }

      dt {
        color: #52606d;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 4px;
      }

      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      @media (max-width: 640px) {
        .practice-details {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <a class="back-link" href="/features/student/pages/landing/landing.html">
          Back to Student Home
        </a>
        <h1>Assigned Practices</h1>
        <p>Your currently assigned practices.</p>
      </header>

      <div id="assigned-practices-status" class="status" role="status">
        Loading assigned practices...
      </div>
      <ul id="assigned-practices-list" class="practice-list" hidden></ul>
    </main>

    <script
      type="module"
      src="./assigned_practices.js?v=20260810-completed-practice"
    ></script>
  </body>
</html>
