<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Learning Dashboard</title>
    <link rel="stylesheet" href="./landing.css?v=20260824-practice-review">

    <script defer src="/__/firebase/12.15.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script type="module" src="/init_fb.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div>
          <h1>My Learning Dashboard</h1>
          <p id="student-welcome">Loading your learning profile...</p>
        </div>
        <button id="student-log-off" type="button">Log Off</button>
      </header>

      <div
        id="student-landing-status"
        class="status"
        role="status"
        aria-live="polite"
      >
        Loading your dashboard...
      </div>

      <section
        id="student-summary-section"
        class="dashboard-section"
        aria-labelledby="student-summary-title"
        hidden
      >
        <div class="section-header">
          <div>
            <h2 id="student-summary-title">Student Summary</h2>
          </div>
        </div>
        <div class="student-summary">
          <div class="summary-item">
            <span class="summary-label">Student name</span>
            <span id="student-name" class="summary-value"></span>
          </div>
          <div class="summary-item">
            <span class="summary-label">Country</span>
            <span id="student-country" class="summary-value"></span>
          </div>
          <div class="summary-item">
            <span class="summary-label">Current grade</span>
            <span id="student-grade" class="summary-value"></span>
          </div>
          <div class="summary-item">
            <span class="summary-label">Stream</span>
            <span id="student-stream" class="summary-value"></span>
          </div>
        </div>
      </section>

      <section
        id="syllabus-progress-section"
        class="dashboard-section"
        aria-labelledby="syllabus-progress-title"
        hidden
      >
        <div class="section-header">
          <div>
            <h2 id="syllabus-progress-title">Syllabus Progress</h2>
            <p>Topic levels and progress towards each framework's final level.</p>
          </div>
        </div>
        <div id="syllabus-progress-list" class="syllabus-list"></div>
      </section>
    </main>

    <script type="module" src="./landing.js?v=20260824-practice-review"></script>
  </body>
</html>
