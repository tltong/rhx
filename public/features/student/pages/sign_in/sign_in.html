<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Sign In</title>

    <script defer src="/__/firebase/12.15.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script type="module" src="/init_fb.js"></script>

    <style>
      body {
        background: #eef3f8;
        color: #102a43;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      main {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 520px;
        padding: 40px 20px;
      }

      section {
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        padding: 28px;
      }

      h1 {
        font-size: 28px;
        margin: 0 0 8px;
      }

      p {
        color: #52606d;
        margin: 0 0 20px;
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        color: #334155;
        display: grid;
        font-weight: 700;
        gap: 6px;
      }

      input {
        border: 1px solid #bcccdc;
        border-radius: 6px;
        box-sizing: border-box;
        font: inherit;
        padding: 10px 12px;
        width: 100%;
      }

      input:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #7dd3fc;
        outline-offset: 2px;
      }

      button,
      .home-link {
        background: #0369a1;
        border: 0;
        border-radius: 6px;
        color: #ffffff;
        cursor: pointer;
        display: inline-block;
        font: inherit;
        font-weight: 700;
        padding: 12px 16px;
        text-align: center;
        text-decoration: none;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .actions {
        display: grid;
        gap: 10px;
      }

      .status {
        background: #e0f2fe;
        border-radius: 6px;
        color: #075985;
        margin-top: 18px;
        padding: 12px;
      }

      .status.is-error {
        background: #fee2e2;
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Student Sign In</h1>
        <p>Sign in with your username and PIN.</p>

        <form id="student-sign-in-form">
          <label>
            Username
            <input
              id="student-username"
              name="username"
              autocomplete="username"
              pattern="[A-Za-z0-9._-]{3,40}"
              required
            >
          </label>

          <label>
            6 digit PIN
            <input
              id="student-pin"
              name="pin"
              type="password"
              autocomplete="current-password"
              inputmode="numeric"
              maxlength="6"
              pattern="[0-9]{6}"
              required
            >
          </label>

          <div class="actions">
            <button id="student-sign-in-submit" type="submit" disabled>
              Sign In
            </button>
            <a class="home-link" href="/index.html">Back To Home</a>
          </div>
        </form>

        <div id="student-sign-in-status" class="status" role="status">
          Enter your username and PIN.
        </div>
      </section>
    </main>

    <script type="module" src="./sign_in.js?v=20260808-auth-redirect"></script>
  </body>
</html>
