<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Generator Admin</title>
    <link rel="stylesheet" href="./question_generator_admin.css?v=20260722-question-diagram-preview">
    <script defer src="/__/firebase/12.15.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/12.15.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script type="module" src="/init_fb.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <a class="back-link" href="/">Back to Home</a>
        <h1>Question Generator Admin</h1>
        <p>Generate syllabus questions and save them to the question bank.</p>
      </header>

      <section class="panel">
        <div class="selection-grid">
          <label class="field">
            <span>LLM prompt config</span>
            <select id="config-select">
              <option value="">Select prompt config</option>
            </select>
          </label>

          <label class="field">
            <span>Syllabus</span>
            <select id="syllabus-select">
              <option value="">Select syllabus</option>
            </select>
          </label>
        </div>

        <section id="syllabus-summary" class="syllabus-summary" hidden>
          <h2>Selected Syllabus</h2>
          <dl class="summary-grid">
            <div>
              <dt>Country</dt>
              <dd id="summary-country"></dd>
            </div>
            <div>
              <dt>Level</dt>
              <dd id="summary-level"></dd>
            </div>
            <div>
              <dt>Year</dt>
              <dd id="summary-year"></dd>
            </div>
            <div>
              <dt>Subject</dt>
              <dd id="summary-subject"></dd>
            </div>
          </dl>
        </section>

        <fieldset class="topics-section">
          <legend>Topic</legend>
          <div id="topics-container" class="topics-list">
            <p class="empty-message">Select a syllabus to load its topics.</p>
          </div>
        </fieldset>

        <section class="generation-fields">
          <label class="field">
            <span>Number of questions</span>
            <input id="number-of-questions" type="number" min="1" step="1" value="10">
          </label>

          <label class="field">
            <span>Difficulty level</span>
            <select id="difficulty-level">
              <option value="Easy">Easy</option>
              <option value="Medium" selected>Medium</option>
              <option value="Hard">Hard</option>
            </select>
          </label>

          <label class="field">
            <span>Question group</span>
            <select id="question-group">
              <option value="">Select question group</option>
            </select>
          </label>

          <label class="field">
            <span>Language</span>
            <select id="language-select">
              <option value="">Select language</option>
            </select>
          </label>

          <label class="diagram-option">
            <input id="include-diagram" type="checkbox">
            <span>Apply the topic's configured diagram percentage</span>
          </label>

          <label class="field full-width">
            <span>Additional instructions</span>
            <textarea id="additional-instructions" rows="4" placeholder="Optional instructions for this request"></textarea>
          </label>
        </section>

        <div class="actions">
          <button id="generate-questions" type="button" disabled>Generate and Save Questions</button>
        </div>

        <p id="status-message" class="status" hidden></p>
      </section>

      <section id="results-section" class="results" hidden>
        <header class="results-header">
          <div>
            <h2>Generation Results</h2>
            <p id="results-summary"></p>
          </div>
        </header>

        <section id="prompts-section" class="result-section" hidden>
          <div class="section-header">
            <label class="field batch-field">
              <span>Batch prompt</span>
              <select id="prompt-batch-select"></select>
            </label>
            <button id="copy-prompt" type="button" class="secondary" disabled>Copy Prompt</button>
          </div>
          <textarea id="prompt-output" rows="16" readonly></textarea>
        </section>

        <section id="questions-section" class="result-section" hidden>
          <h2>Saved Questions</h2>
          <div id="questions-container" class="questions-list"></div>
        </section>
      </section>
    </main>

    <script type="module" src="./question_generator_admin.js?v=20260727-topic-diagram-config"></script>
  </body>
</html>
